services:
  redis:
    image: redis:7-alpine # Usar versiones alpine reduce vulnerabilidades y peso
    restart: unless-stopped
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      # Seguridad: Usamos variables de entorno con fallbacks (valores por defecto) para desarrollo
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Postgresql@2026}
      POSTGRES_DB: ${DB_NAME:-exactosbc}
    shm_size: 512MB

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${LISTEN_IP:-127.0.0.1}:9000:9000"
      - "${LISTEN_IP:-127.0.0.1}:9005:9001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - htpasswd-cache:/etc/nginx/.htpasswd
    ports:
      - "${LISTEN_IP:-127.0.0.1}:8000:8000"
    depends_on:
      app:
        condition: service_started
      adminer:
        condition: service_started
      htpasswd-generator:
        condition: service_completed_successfully

  htpasswd-generator:
    image: httpd:alpine
    command: >
      sh -c "htpasswd -bc /htpasswd/htpasswd admin ${ADMIN_PASSWORD:-admin} &&
             chmod 644 /htpasswd/htpasswd &&
             echo 'Generated htpasswd file with username: admin'"
    volumes:
      - htpasswd-cache:/htpasswd
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}

  adminer-init:
    image: alpine:latest
    volumes:
      - adminer-permanent-login-key:/adminer-permanent-login-key-volume
    command: >
      sh -c '
        if [ ! -f /adminer-permanent-login-key-volume/adminer-permanent-login-key ]; then
          dd bs=64 count=1 if=/dev/urandom 2>/dev/null | base64 | LC_ALL=C tr -dc '"'"'a-zA-Z0-9'"'"' | fold -w 32 | head -n 1 > /adminer-permanent-login-key-volume/adminer-permanent-login-key
          chmod 644 /adminer-permanent-login-key-volume/adminer-permanent-login-key
        fi
      '

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      adminer-init:
        condition: service_completed_successfully
    volumes:
      - adminer-permanent-login-key:/adminer-permanent-login-key-volume
    environment:
      # Pasamos las credenciales al contenedor de Adminer para que el script PHP las lea
      ADMINER_DB_USER: ${DB_USER:-postgres}
      ADMINER_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ADMINER_DB_NAME: ${DB_NAME:-app}
    configs:
      - source: adminer-index.php
        target: /var/www/html/index.php
        mode: 0444

  # Contenedor Principal (API / Frontend)
  app:
    container_name: ExactosBC-App
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      minio:
        condition: service_started
    command: >
      /usr/bin/tini -- bash -c '
        if [ "$NODE_ENV" = "development" ]; then
          echo "Running in development mode"
          PORT=3000 pnpm dev
        else
          echo "Running in production mode"
          PORT=3000 pnpm start
        fi
      '
    working_dir: /app
    volumes:
      - ../:/app
      - node-modules-cache:/app/node_modules:nocopy
    tmpfs:
      - /app/.pnpm-store:ro,size=1k
    env_file:
      - ../.env

  # -----------------------------------------------------------
  # Arquitectura Escalable: Contenedor Worker (Procesos en 2do plano)
  # Descomenta este bloque cuando configures BullMQ u otro sistema de colas.
  # -----------------------------------------------------------
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     redis:
  #       condition: service_started
  #     postgres:
  #       condition: service_started
  #   command: /usr/bin/tini -- bash -c 'pnpm run worker'
  #   working_dir: /app
  #   volumes:
  #     - ../:/app
  #     - node-modules-cache:/app/node_modules:nocopy
  #   env_file:
  #     - ../.env

volumes:
  postgres-data:
  redis-data:
  minio-data:
  adminer-permanent-login-key:
  htpasswd-cache:
  node-modules-cache:

configs:
  adminer-index.php:
    content: |
      <?php

      function adminer_object() {
        class AdminerSoftware extends Adminer\Adminer {
          // 👇 Escapamos el $ de $create
          function permanentLogin($$create = false) {
            return file_get_contents('/adminer-permanent-login-key-volume/adminer-permanent-login-key');
          }

          function credentials() {
            return array('postgres', getenv('ADMINER_DB_USER'), getenv('ADMINER_DB_PASSWORD'));
          }

          function database() {
            return getenv('ADMINER_DB_NAME');
          }

          function schemas() {
            return array('public');
          }
        }
        return new AdminerSoftware();
      }

      // 👇 Escapamos los $ de $_COOKIE y $_POST
      if (empty($$_COOKIE['adminer_permanent'])) {
        $$_POST['auth'] = [
          'driver'    => 'pgsql',
          'server'    => 'postgres',
          'username'  => getenv('ADMINER_DB_USER'),
          'password'  => getenv('ADMINER_DB_PASSWORD'),
          'db'        => getenv('ADMINER_DB_NAME'),
          'permanent' => 1,
        ];
      }

      // 👇 Escapamos los $ de $_GET
      $$_GET['pgsql'] = 'postgres';
      $$_GET['username'] = getenv('ADMINER_DB_USER');
      $$_GET['db'] = getenv('ADMINER_DB_NAME');

      include './adminer.php';
