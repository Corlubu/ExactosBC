server {
  listen 8000;
  server_name localhost;

  # Seguridad: Prevenir ataques DoS. 50MB es suficiente para fotos y reportes.
  client_max_body_size 50M;

  # Cabeceras de seguridad HTTP básicas
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Content-Type-Options "nosniff";

  location / {
    proxy_pass http://app:3000/;

    absolute_redirect off;
    chunked_transfer_encoding off;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 🚨 ADMINER DEBE ESTAR BLOQUEADO EN PRODUCCIÓN 🚨
  # Si necesitas usarlo en producción, descomenta las líneas "allow" y pon la IP pública fija de tu oficina.
  location /codapt/db/ {
    # allow 203.0.113.50;  # <--- Reemplazar con la IP de tu oficina
    # deny all;            # <--- Bloquear el resto de internet

    proxy_pass http://adminer:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    auth_basic "Acceso Restringido a Administradores";
    auth_basic_user_file /etc/nginx/.htpasswd/htpasswd;
  }
}
